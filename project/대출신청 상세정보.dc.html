        [field('금소법결과', 'kfcResult', { mask: true }), field('금소법관리번호', 'kfcNo'), field('실소유자여부', 'owner')],
      ],
      contract: [[field('약정완료일시', 'signAt'), field('약정서명수단', 'signBy'), field('CMS서명수단', 'cmsBy')]],
      title: [[field('권원청약상태', 'titleStatus'), field('전자등기상태', 'regStatus'), blank()]],
      exec1: [
        [field('실행일시', 'execAt'), field('진행상태', 'execStatus'), field('실행중단사유', 'stopReason')],
        [field('수동실행여부', 'manual'), field('수동실행자', 'manualBy'), field('강제실행여부', 'force')],
        [field('강제실행설명', 'forceDesc', { span: 2 }), blank()],
      ],
      exec2: [
        [field('기표완료일시', 'doneAt'), blank(2)],
        [field('계좌번호', 'acct'), field('고객번호', 'custNo'), blank()],
        [field('대출금액', 'loanAmt', { unit: '원' }), field('대출실행일', 'loanDate'), field('대출만기일', 'dueDate')],
        [field('대출기간', 'loanMonths', { unit: '개월' }), field('거치기간', 'graceMonths', { unit: '개월' }), field('상환방식', 'repay2')],
        [field('금리변동구분', 'rateType'), field('금리변동주기', 'rateCycle', { unit: '개월' }), field('연체이율', 'overdue', { unit: '%' })],
        [field('결제일', 'payDay', { unit: '일' }), field('회차별상환금', 'installment', { unit: '원' }), field('중도수수료율', 'earlyFee', { unit: '%' })],
        [field('CMS은행', 'cmsBank'), field('CMS계좌번호', 'cmsAcct', { mask: true }), field('CMS수취인명', 'cmsName', { mask: true })],
        [field('대출송금은행', 'sendBank'), field('송금계좌번호', 'sendAcct', { mask: true }), field('송금수취인명', 'sendName')],
      ],
    };

    const L = (label, id) => ({ label, id });
    const tree = [
      { label: '회원', children: [L('회원조회')] },
      { label: '여신', open: true, children: [
        L('요약정보'),
        { label: '개인신용', children: [L('대출신청 목록')] },
        { label: '모기지', open: true, children: [
          { label: '간편한도조회', children: [L('간편한도조회 목록')] },
          { label: '대출신청', open: true, children: [L('대출신청 목록', 'list'), L('대출신청 상세정보', 'detail'), L('대출신청 서류접수 목록'), L('정밀심사 대상 목록'), L('대출실행 대상 목록'), L('대출실행 목록')] },
          L('모기지 이관 목록'),
        ] },
        { label: '오토', children: [L('대출신청 목록')] },
        { label: '예적금 담보대출', children: [L('대출신청 목록')] },
        { label: '사후관리', children: [L('연체관리')] },
      ] },
      { label: '수신', children: [L('예금계좌조회')] },
      { label: '고객지원', children: [L('상담이력')] },
      { label: '마케팅', children: [L('캠페인')] },
      { label: '설정', children: [L('권한관리')] },
      { label: '리포트', children: [L('일일보고서')] },
      { label: '시스템', children: [L('코드관리')] },
    ];

    return {
      r, tree,
      menu: ['회원', '여신', '수신', '고객지원', '마케팅', '설정', '리포트', '시스템'],
      shortcuts: ['바로가기'], history: ['메뉴이력'], lnbTabs: ['업무메뉴', '즐겨찾기'],
      lnbOpen: this.state.lnbOpen, setLnb: (v) => this.setState({ lnbOpen: v }),
      mainPad: this.state.lnbOpen ? '20px 30px' : '20px 30px 20px 53px',
      searchProps: { placeholder: '조회하려는 고객의 신청번호를 입력하세요.', value: this.state.query, readOnly: false, onChange: (e) => this.setState({ query: e.target.value }) },
      doSearch: () => {},
      tabs: ['상세정보', '담보제공자', '담보정보', '한도조회이력', '서류제출', '신용정보', '채무현황', 'CSS정보', '권원보험', '전자등기', '비용내역', '이력조회'],
      tab: this.state.tab, setTab: (v) => this.setState({ tab: v }),
      isDetail: this.state.tab === '상세정보', notDetail: this.state.tab !== '상세정보',
      idOpts1: ['신분증진위확인', '신분증OCR'], idOpts2: ['타행계좌인증', '휴대폰본인확인'],
      act: {
        terms: btns('약관동의내역'), checklist: btns('실행 체크리스트'), limit: btns('한도산출 상세'),
        identity: btns('신분증 이미지', '본인확인이력'), contract: btns('약정서/설명서'), exec: btns('실행상세', '수동실행'),
      },
    };
  }
}
</script>
