name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format
      - run: npm test
      - run: npm run build
      - name: api/generate.js가 src/server와 일치하는지 확인
        run: git diff --exit-code -- api/generate.js || (echo '::error::api/generate.js가 오래됨. npm run build:api 후 커밋하세요.' && exit 1)
